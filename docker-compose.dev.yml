services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-genai-backend-dev
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - DATABASE_URL=sqlite:///./enterprise_genai.db
      - VECTOR_DB_PATH=/app/data/vector_db
      - DOCUMENT_STORE_PATH=/app/data/documents
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379
      - LLM_MODEL=deepseek-chat
      - LLM_BASE_URL=https://api.deepseek.com/v1
      - MAX_TOKENS=8192
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      - redis
    networks:
      - genai-network
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  redis:
    image: redis:7-alpine
    container_name: enterprise-genai-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - genai-network
    restart: unless-stopped

volumes:
  redis_data_dev:
    driver: local

networks:
  genai-network:
    driver: bridge