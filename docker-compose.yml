services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-genai-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - DATABASE_URL=sqlite:///./enterprise_genai.db
      - VECTOR_DB_PATH=/app/data/vector_db
      - DOCUMENT_STORE_PATH=/app/data/documents
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379
      - LLM_MODEL=deepseek-chat
      - LLM_BASE_URL=https://api.deepseek.com/v1
      - MAX_TOKENS=8192
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      - redis
    networks:
      - genai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise-genai-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - genai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: enterprise-genai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - genai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local

networks:
  genai-network:
    driver: bridge